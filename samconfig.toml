version = 0.1

[default.global.parameters]
stack_name = "akinator-line-bot"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# シークレットはコマンドラインで渡す:
# sam deploy --parameter-overrides LineChannelSecret=xxx LineChannelAccessToken=yyy
s3_prefix = "akinator-line-bot"
region = "ap-northeast-1"
image_repositories = []
